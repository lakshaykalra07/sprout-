<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitemap — London</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F3EE;--bg2:#EDE8E0;--bg3:#E2DAD0;
  --ink:#1C1916;--ink2:#4A4540;--ink3:#9C9590;
  --rule:#DDD8D0;--rule2:#CBC5BC;
  --surface:#FFFFFF;
  --accent:#C4572A;--accent2:#E07848;--accent-bg:#F5EAE4;
  --gold:#8B6914;--green:#3A6B3A;--blue:#2255AA;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Instrument Sans",system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* AUTH */
#authScreen{
  align-items:center;justify-content:center;
  background:linear-gradient(145deg,#2A1F14 0%,#1C1510 60%,#3A2818 100%);
}
.auth-wrap{
  width:100%;max-width:380px;padding:3rem 2.5rem;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:4px;
}
.auth-brand{font-family:var(--serif);font-size:3rem;font-weight:300;letter-spacing:.1em;text-align:center;margin-bottom:.25rem;color:#F7F3EE}
.auth-city{text-align:center;font-size:.62rem;letter-spacing:.35em;text-transform:uppercase;color:rgba(247,243,238,.35);margin-bottom:2.5rem}
.google-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:.7rem;
  background:rgba(255,255,255,.92);color:#1C1916;border:none;padding:.8rem 1rem;
  font-family:var(--sans);font-size:.82rem;font-weight:500;cursor:pointer;
  margin-bottom:1.5rem;transition:background .15s;border-radius:2px;
}
.google-btn:hover{background:#fff}
.auth-or{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.auth-or::before,.auth-or::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.auth-or span{font-size:.68rem;color:rgba(247,243,238,.3);letter-spacing:.1em}
.auth-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:1.5rem}
.auth-tab{
  flex:1;padding:.55rem 0;text-align:center;font-size:.72rem;
  letter-spacing:.08em;text-transform:uppercase;
  color:rgba(247,243,238,.35);border:none;background:transparent;
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  font-family:var(--sans);transition:all .15s;
}
.auth-tab.active{color:#F7F3EE;border-bottom-color:var(--accent2)}
.auth-field{margin-bottom:1rem}
.auth-field label{display:block;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(247,243,238,.4);margin-bottom:.5rem}
.auth-field input{
  width:100%;background:transparent;border:none;
  border-bottom:1px solid rgba(255,255,255,.15);
  color:#F7F3EE;padding:.5rem 0;font-family:var(--sans);font-size:.88rem;
  outline:none;transition:border-color .15s;
}
.auth-field input:focus{border-bottom-color:var(--accent2)}
.auth-field input::placeholder{color:rgba(247,243,238,.25)}
.auth-submit{
  width:100%;background:var(--accent);color:#fff;border:none;padding:.85rem;
  font-family:var(--sans);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;
  cursor:pointer;margin-top:.5rem;transition:background .15s;border-radius:2px;
}
.auth-submit:hover{background:var(--accent2)}
.auth-skip{
  width:100%;background:transparent;border:none;color:rgba(247,243,238,.35);
  font-family:var(--sans);font-size:.72rem;cursor:pointer;margin-top:1.2rem;
  text-decoration:underline;text-underline-offset:3px;
}
.auth-skip:hover{color:rgba(247,243,238,.7)}
.auth-err{font-size:.75rem;color:#E07878;margin-top:.8rem;text-align:center;min-height:1rem}

/* NAV */
.app-nav{
  position:sticky;top:0;z-index:50;
  background:rgba(247,243,238,.97);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--rule);
}
.nav-top{display:flex;align-items:center;padding:0 2.5rem;height:58px;gap:2rem}
.nav-brand{
  font-family:var(--serif);font-size:1.7rem;font-weight:300;
  letter-spacing:.08em;color:var(--ink);cursor:pointer;flex-shrink:0;
}
.nav-brand em{font-style:normal;color:var(--accent)}
.nav-search-wrap{flex:1;max-width:480px;position:relative}
.nav-search-wrap input{
  width:100%;background:var(--bg2);border:1px solid var(--rule);
  border-radius:6px;padding:.5rem 3.5rem .5rem 1rem;
  font-family:var(--sans);font-size:.82rem;color:var(--ink);outline:none;transition:all .15s;
}
.nav-search-wrap input:focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.nav-search-wrap input::placeholder{color:var(--ink3)}
.nav-sbtn{
  position:absolute;right:.5rem;top:50%;transform:translateY(-50%);
  background:var(--accent);border:none;color:#fff;
  padding:.28rem .65rem;border-radius:4px;
  font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  font-family:var(--sans);cursor:pointer;transition:background .15s;
}
.nav-sbtn:hover{background:var(--accent2)}
.nav-right{display:flex;align-items:center;gap:1.2rem;margin-left:auto;flex-shrink:0}
.nl{
  font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);cursor:pointer;background:none;border:none;
  font-family:var(--sans);transition:color .15s;white-space:nowrap;
}
.nl:hover{color:var(--accent)}
.nav-user{font-size:.7rem;color:var(--ink3)}

/* FILTER STRIP */
.filter-strip{
  display:flex;align-items:center;padding:0 2.5rem;
  border-top:1px solid var(--rule);background:var(--bg2);
  overflow-x:auto;scrollbar-width:none;
}
.filter-strip::-webkit-scrollbar{display:none}
.fc{
  font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);background:none;border:none;padding:.65rem 1rem;
  cursor:pointer;font-family:var(--sans);border-bottom:2px solid transparent;
  white-space:nowrap;transition:all .15s;flex-shrink:0;
}
.fc:hover{color:var(--ink)}
.fc.on{color:var(--accent);border-bottom-color:var(--accent)}
.fs{width:1px;height:12px;background:var(--rule2);flex-shrink:0;margin:0 .3rem}
.fsel{
  font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);background:none;border:none;
  font-family:var(--sans);cursor:pointer;outline:none;
  padding:.65rem .4rem;appearance:none;flex-shrink:0;
}

/* HOME */
#homeScreen{background:var(--bg)}

/* HERO */
.hero{
  background:linear-gradient(145deg,#2A1F14 0%,#1C1510 60%,#3A2818 100%);
  padding:5rem 2.5rem 4rem;
  display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:end;
}
.hero-kicker{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent2);margin-bottom:1.5rem;opacity:.8}
.hero-title{
  font-family:var(--serif);font-size:clamp(3rem,6vw,5.5rem);
  font-weight:300;line-height:1;letter-spacing:-.01em;
  color:#F7F3EE;margin-bottom:2.5rem;
}
.hero-title em{font-style:italic;color:var(--accent2)}
.hero-search{
  display:flex;align-items:center;
  background:rgba(247,243,238,.08);border:1px solid rgba(247,243,238,.15);
  border-radius:8px;overflow:hidden;max-width:500px;transition:all .2s;
}
.hero-search:focus-within{background:rgba(247,243,238,.12);border-color:var(--accent2)}
.hero-search input{
  flex:1;background:none;border:none;color:#F7F3EE;
  padding:1rem 1.2rem;font-family:var(--sans);font-size:.9rem;outline:none;
}
.hero-search input::placeholder{color:rgba(247,243,238,.35)}
.hero-go{
  background:var(--accent);border:none;color:#fff;
  padding:.85rem 1.4rem;font-family:var(--sans);
  font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:background .15s;flex-shrink:0;
}
.hero-go:hover{background:var(--accent2)}
.hero-tags-lbl{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(247,243,238,.3);margin-bottom:1.2rem}
.hero-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:3rem}
.htag{
  font-family:var(--serif);font-style:italic;font-size:1.05rem;font-weight:300;
  color:rgba(247,243,238,.55);background:none;border:none;cursor:pointer;
  padding:0;transition:color .15s;
}
.htag:hover{color:var(--accent2)}
.htag::after{content:" ·";color:rgba(247,243,238,.2)}
.htag:last-child::after{display:none}
.hero-stats{display:flex;gap:2.5rem}
.stat-n{font-family:var(--serif);font-size:2.2rem;font-weight:300;color:#F7F3EE;display:block;line-height:1}
.stat-l{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(247,243,238,.3);display:block;margin-top:.3rem}

/* AI STRIP */
.ai-strip{display:none;padding:.9rem 2.5rem;background:var(--accent-bg);border-bottom:1px solid #DDD0C8;align-items:baseline;gap:1rem}
.ai-strip.on{display:flex}
.ai-lbl{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);flex-shrink:0}
.ai-txt{font-family:var(--serif);font-style:italic;font-size:.95rem;font-weight:300;color:var(--ink2);line-height:1.4}

/* SECTION HEAD */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:2rem 2.5rem 1.2rem}
.sec-title{font-family:var(--serif);font-size:1.5rem;font-weight:300;letter-spacing:.02em}
.sec-count{font-size:.68rem;color:var(--ink3);letter-spacing:.06em}

/* VENUE LIST */
.venue-list{padding:0 0 4rem}
.vrow{
  display:grid;grid-template-columns:52px 1fr auto;
  align-items:start;gap:1.5rem;padding:1.4rem 2.5rem;
  border-bottom:1px solid var(--rule);cursor:pointer;transition:background .12s;
  animation:fadeIn .4s ease both;
}
.vrow:hover{background:var(--bg2)}
.vrow:nth-child(odd){background:var(--surface)}
.vrow:nth-child(odd):hover{background:var(--bg2)}
.vnum{font-family:var(--serif);font-size:.7rem;color:var(--ink3);padding-top:.2rem;font-weight:300}
.vmain{}
.vname-row{display:flex;align-items:baseline;gap:.7rem;margin-bottom:.3rem;flex-wrap:wrap}
.vname{font-family:var(--serif);font-size:1.25rem;font-weight:400;letter-spacing:.01em;line-height:1.2}
.vctag{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-bg);padding:.15rem .5rem;border-radius:2px}
.vlive{font-size:.6rem;color:var(--ink3);display:flex;align-items:center;gap:.3rem}
.ldot{width:5px;height:5px;border-radius:50%;background:#C44;display:inline-block}
.vdiet{display:flex;gap:.35rem}
.dp{font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;padding:.12rem .45rem;border-radius:2px}
.dv{background:#EBF5EB;color:var(--green)}
.dh{background:#EBF0F8;color:var(--blue)}
.dg{background:#F3EBF5;color:#6A3A7A}
.vmeta{font-size:.72rem;color:var(--ink3);display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.4rem}
.vsep{color:var(--rule2)}
.vdesc{font-family:var(--serif);font-style:italic;font-size:.88rem;font-weight:300;color:var(--ink2);line-height:1.55;max-width:580px;margin-bottom:.5rem}
.vtags{display:flex;gap:.35rem;flex-wrap:wrap}
.vt{font-size:.58rem;letter-spacing:.06em;color:var(--ink3);background:var(--bg3);padding:.15rem .5rem;border-radius:2px}
.vright{display:flex;flex-direction:column;align-items:flex-end;gap:.6rem;padding-top:.2rem;flex-shrink:0}
.vrating{font-family:var(--serif);font-size:1rem;font-weight:400;color:var(--gold)}
.vprice{font-size:.7rem;color:var(--ink3)}
.vactions{display:flex;align-items:center;gap:.7rem}
.fav-btn{background:none;border:none;font-size:.9rem;cursor:pointer;color:var(--ink3);transition:color .15s}
.fav-btn:hover,.fav-btn.saved{color:var(--accent)}
.vlink{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:1px;transition:opacity .15s}
.vlink:hover{opacity:.6}

/* EMPTY */
.empty-state{padding:5rem 2.5rem;text-align:center}
.empty-title{font-family:var(--serif);font-size:1.8rem;font-weight:300;font-style:italic;color:var(--ink3);margin-bottom:.8rem}
.empty-sub{font-size:.78rem;color:var(--ink3);margin-bottom:1.5rem}
.empty-cta{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;background:var(--accent);color:#fff;border:none;padding:.7rem 1.5rem;cursor:pointer;font-family:var(--sans);border-radius:4px}

/* QUIZ */
#quizScreen{background:var(--bg)}
.qsub{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2.5rem;border-bottom:1px solid var(--rule);background:var(--bg2)}
.qsub-lbl{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
.pdots{display:flex;gap:4px}
.pdot{width:22px;height:2px;background:var(--rule2);transition:background .3s}
.pdot.done{background:var(--accent);opacity:.4}
.pdot.active{background:var(--accent)}
.qstage{flex:1;display:flex;align-items:center;justify-content:center;padding:4rem 2.5rem}
.qcard{width:100%;max-width:560px;animation:fadeIn .4s ease both}
.qnum{font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--ink3);margin-bottom:1.2rem}
.qtext{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:300;line-height:1.15;margin-bottom:2.5rem;letter-spacing:-.01em}
.qtext em{font-style:italic;color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.opts .opt:last-child:nth-child(odd){grid-column:1/-1;max-width:50%}
.opt{background:var(--surface);border:1px solid var(--rule);padding:1rem 1.2rem;cursor:pointer;text-align:left;transition:all .15s;font-family:var(--sans);border-radius:6px}
.opt:hover{border-color:var(--accent);background:var(--accent-bg)}
.opt.sel{border-color:var(--accent);background:var(--accent);color:#fff}
.oe{font-size:1.2rem;display:block;margin-bottom:.4rem}
.ol{font-family:var(--serif);font-size:1rem;font-weight:400;display:block}
.os{font-size:.7rem;color:var(--ink3);display:block;margin-top:.15rem}
.opt.sel .os{color:rgba(255,255,255,.65)}
.skip-row{text-align:center;margin-top:2rem}
.skip-btn{font-size:.7rem;letter-spacing:.06em;color:var(--ink3);background:none;border:none;cursor:pointer;font-family:var(--sans);text-decoration:underline;text-underline-offset:3px}
.skip-btn:hover{color:var(--ink)}

/* ADD MODAL */
#addModal{position:fixed;inset:0;background:rgba(28,25,22,.7);z-index:400;display:none;align-items:center;justify-content:center;padding:1.5rem}
#addModal.active{display:flex}
.mbox{background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:2.5rem;border-radius:8px;border-top:4px solid var(--accent);box-shadow:0 24px 60px rgba(0,0,0,.25);animation:fadeIn .25s ease both}
.mhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2rem}
.mtitle{font-family:var(--serif);font-size:1.8rem;font-weight:300}
.mclose{background:none;border:none;cursor:pointer;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-family:var(--sans)}
.mf{margin-bottom:1.2rem}
.mf label{display:block;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);margin-bottom:.5rem}
.mf input,.mf select,.mf textarea{width:100%;background:var(--bg);border:none;border-bottom:1px solid var(--rule2);color:var(--ink);padding:.5rem 0;font-family:var(--sans);font-size:.85rem;outline:none;transition:border-color .15s}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-bottom-color:var(--accent)}
.mf textarea{resize:vertical;min-height:60px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.msub{width:100%;background:var(--accent);color:#fff;border:none;padding:.9rem;border-radius:4px;font-family:var(--sans);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;margin-top:.5rem;transition:background .15s}
.msub:hover{background:var(--accent2)}
.mnote{font-size:.7rem;color:var(--ink3);margin-top:.8rem;text-align:center;line-height:1.6}

/* FAVS */
#favsPanel{position:fixed;inset:0;background:rgba(28,25,22,.5);z-index:300;display:none;justify-content:flex-end}
#favsPanel.active{display:flex}
.fdrawer{background:var(--surface);width:100%;max-width:360px;height:100vh;overflow-y:auto;padding:2.5rem;animation:slideIn .3s cubic-bezier(.22,1,.36,1) both;border-left:1px solid var(--rule);box-shadow:-8px 0 32px rgba(0,0,0,.08)}
.fhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2rem;border-bottom:1px solid var(--rule);padding-bottom:1rem}
.ftitle{font-family:var(--serif);font-size:1.5rem;font-weight:300}
.fclose{background:none;border:none;cursor:pointer;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-family:var(--sans)}
.fitem{display:flex;align-items:baseline;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--rule)}
.fnum{font-family:var(--serif);font-size:.7rem;color:var(--ink3);flex-shrink:0}
.fname{font-family:var(--serif);font-size:1rem;font-weight:400;display:block;margin-bottom:.15rem}
.farea{font-size:.7rem;color:var(--ink3)}
.frm{background:none;border:none;cursor:pointer;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-family:var(--sans)}
.frm:hover{color:var(--accent)}
.fempty{font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--ink3);padding:2rem 0;line-height:1.7}

/* LOADING */
#loadScreen{position:fixed;inset:0;background:linear-gradient(145deg,#2A1F14,#1C1510);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
#loadScreen.on{display:flex}
.lbrand{font-family:var(--serif);font-size:2.5rem;font-weight:300;letter-spacing:.12em;color:#F7F3EE;animation:pulse 1.5s ease-in-out infinite}
.ltxt{font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:rgba(247,243,238,.35)}

/* TOAST */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:.65rem 1.4rem;border-radius:4px;font-size:.72rem;letter-spacing:.06em;z-index:999;transition:transform .3s cubic-bezier(.22,1,.36,1);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{transform:translateX(-50%) translateY(0)}

@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

@media(max-width:768px){
  .hero{grid-template-columns:1fr;gap:2rem;padding:3rem 1.5rem 2.5rem}
  .hero-right{display:none}
  .nav-top{padding:0 1.2rem;gap:1rem}
  .filter-strip{padding:0 1rem}
  .vrow{padding:1.2rem 1.5rem;grid-template-columns:36px 1fr auto;gap:1rem}
  .sec-head{padding:1.5rem}
  .nav-search-wrap{display:none}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div id="loadScreen">
  <div class="lbrand">Bitemap</div>
  <div class="ltxt" id="ltxt">Searching London…</div>
</div>

<!-- FAVS PANEL -->
<div id="favsPanel" onclick="if(event.target===this)closeFavs()">
  <div class="fdrawer">
    <div class="fhead">
      <div class="ftitle">Saved spots</div>
      <button class="fclose" onclick="closeFavs()">Close</button>
    </div>
    <div id="favsList"></div>
  </div>
</div>

<!-- ADD VENUE MODAL -->
<div id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="mbox">
    <div class="mhead">
      <div class="mtitle">Add a Venue</div>
      <button class="mclose" onclick="closeAdd()">Close</button>
    </div>
    <div class="mf"><label>Name *</label><input type="text" id="vName" placeholder="e.g. The Palomar"></div>
    <div class="mrow">
      <div class="mf"><label>Area *</label><input type="text" id="vArea" placeholder="e.g. Soho"></div>
      <div class="mf"><label>Type</label>
        <select id="vType">
          <option value="restaurant">Restaurant</option>

function qs(q) {
  document.getElementById('heroQ').value = q;
  document.getElementById('navQ').value = q;

}

function doSearch() {
  const h = document.getElementById('heroQ').value.trim();
  const n = document.getElementById('navQ').value.trim();
  const raw = h || n;
  document.getElementById('heroQ').value = raw;
  document.getElementById('navQ').value = raw;
  if (!raw) { activeQ = ''; hideAI(); applyFilters(); return; }
  activeQ = raw.toLowerCase();
  applyFilters();
  fetchLive(raw);
}

async function fetchLive(raw) {
  const area = areaF !== 'all' ? areaF : 'London';
  showAI('Searching for "' + raw + '" across ' + area + '…', true);
  try {
    const url = 'https://maps.googleapis.com/maps/api/place/textsearch/json?query=' +
      encodeURIComponent(raw + ' restaurant ' + area) + '&key=' + GKEY;
    const r = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
    const d = await r.json();
    if (d.results && d.results.length) {
      const live = d.results.slice(0, 8).map(p => ({
        id: p.place_id, name: p.name,
        area: area, hood: (p.formatted_address || '').split(',')[1]?.trim() || area,
        type: 'restaurant', cuisine: raw.charAt(0).toUpperCase() + raw.slice(1),
        diet: [], rating: p.rating || null, pl: p.price_level || 2,
        cost: ['under20','under20','20-40','40-70','70plus'][p.price_level || 2],
        desc: 'A popular ' + area + ' spot for ' + raw + '.',
        tags: [raw, 'Live result'],
        maps: 'https://www.google.com/maps/place/?q=place_id:' + p.place_id,
        isLive: true
      }));
      const local = venues.filter(v => matches(v, activeQ));
      const merged = [...live, ...local.filter(l => !live.find(lv => lv.name === l.name))];
      document.getElementById('secTitle').textContent = 'Results for "' + raw + '"';
      document.getElementById('secCount').textContent = merged.length + ' spot' + (merged.length !== 1 ? 's' : '');
      renderVenues(merged);
      const rec = await getAIRec(raw, area, merged.slice(0, 3).map(v => v.name).join(', '));
      if (rec) showAI(rec, false); else hideAI();
    }
  } catch(e) { hideAI(); }
}

async function getAIRec(q, area, names) {
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 60,
        messages: [{ role: 'user', content: 'You are Bitemap, a London food guide. Search: "' + q + '" in ' + area + '. Top spots: ' + names + '. One warm specific sentence (max 15 words). No hashtags.' }]
      })
    });
    const d = await r.json();
    return d.content && d.content[0] ? d.content[0].text.trim() : null;
  } catch(e) { return null; }
}

function showAI(txt, loading) {
  document.getElementById('aiTxt').textContent = txt;
  document.getElementById('aiTxt').style.fontStyle = loading ? 'normal' : 'italic';
  document.getElementById('aiTxt').style.color = loading ? 'var(--ink3)' : 'var(--ink2)';
  document.getElementById('aiStrip').classList.add('on');
}

function setType(t, btn) {

  btn.classList.add('on');
  hideAI(); applyFilters();
}

function setArea(a, btn) {
  areaF = a;
  document.querySelectorAll('[onclick^="setArea"]').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  applyFilters();
}

function toggleDiet(d, btn) {
  if (diets.has(d)) { diets.delete(d); btn.classList.remove('on'); }
  else { diets.add(d); btn.classList.add('on'); }
  applyFilters();
}

function matches(v, q) {
  if (!q) return true;
  const fields = [v.name, v.area, v.hood, v.cuisine, v.desc, ...(v.tags || []), ...(v.diet || [])];
  if (fields.some(s => s && s.toLowerCase().includes(q))) return true;
  const aliases = {
    ramen: ['japanese','noodles','tonkotsu'],
    burger: ['burgers','smash burger','american'],
    pizza: ['neapolitan','italian'],
    sushi: ['japanese','omakase'],
    tacos: ['mexican'],
    curry: ['indian','keralan','sri lankan'],
    brunch: ['breakfast','cafe'],
    steak: ['steakhouse','flat iron'],
    pasta: ['italian'],
    cocktails: ['bar','speakeasy'],
    vegan: ['plant-based'],
    market: ['food market','street market','food hall'],
  };
  for (const [alias, related] of Object.entries(aliases)) {
    if (q.includes(alias) || alias.includes(q)) {
      if (related.some(r => fields.some(s => s && s.toLowerCase().includes(r)))) return true;
    }
  }
  return false;
}

function applyFilters() {
  const minR = parseFloat(document.getElementById('rF').value || 0);
  const cost = document.getElementById('cF').value || 'all';
  const sort = document.getElementById('sF').value || 'rating';
  let res = venues.filter(v => {
    if (typeF !== 'all' && v.type !== typeF) return false;
    if (areaF !== 'all' && v.area !== areaF) return false;
    if (minR > 0 && (v.rating || 0) < minR) return false;
    if (cost !== 'all' && v.cost !== cost) return false;
    if (diets.size > 0 && ![...diets].every(d => (v.diet || []).includes(d))) return false;
    if (activeQ && !matches(v, activeQ)) return false;
    return true;
  });
  if (sort === 'rating') res.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  else res.sort((a, b) => a.name.localeCompare(b.name));
  const title = activeQ ? 'Results for "' + activeQ + '"' :
    typeF === 'market' ? 'Markets' : typeF === 'cafe' ? 'Cafés' :
    typeF === 'bar' ? 'Bars' : typeF === 'restaurant' ? 'Restaurants' : 'Featured spots';
  document.getElementById('secTitle').textContent = title;
  document.getElementById('secCount').textContent = res.length + ' spot' + (res.length !== 1 ? 's' : '');
  renderVenues(res);
}

  }

      '<div class="vnum">' + String(i + 1).padStart(2, '0') + '</div>' +

        '<div class="vname-row">' +
          '<span class="vname">' + v.name + '</span>' +
          '<span class="vctag">' + v.cuisine + '</span>' +
          (v.isLive ? '<span class="vlive"><span class="ldot"></span>Live</span>' : '') +
          '<div class="vdiet">' + dietBadges + '</div>' +
        '</div>' +
        '<div class="vmeta">' +
          '<span>&#128205; ' + v.hood + '</span>' +
          (v.rating ? '<span class="vsep">&#183;</span><span style="color:var(--gold)">&#9733; ' + v.rating + '</span>' : '') +
          '<span class="vsep">&#183;</span><span>' + v.type + '</span>' +
          (v.cost ? '<span class="vsep">&#183;</span><span>' + (costMap[v.cost] || '') + '</span>' : '') +
        '</div>' +
        '<div class="vdesc">' + v.desc + '</div>' +
        '<div class="vtags">' + (v.tags || []).slice(0, 5).map(t => '<span class="vt">' + t + '</span>').join('') + '</div>' +
      '</div>' +
      '<div class="vright" onclick="event.stopPropagation()">' +
        (v.rating ? '<div class="vrating">&#9733; ' + v.rating + '</div>' : '') +
        '<div class="vprice">' + (priceMap[v.pl] || '££') + '</div>' +
        '<div class="vactions">' +
          '<button class="fav-btn' + (saved ? ' saved' : '') + '" data-id="' + v.id + '" onclick="toggleFav(window.VM['' + v.id + ''])">' + (saved ? '&#9829;' : '&#9825;') + '</button>' +
          '<a class="vlink" href="' + v.maps + '" target="_blank" rel="noopener">Maps</a>' +

  }).join('');

async function loadFavs() {
  if (!user) return;
  try {
    const { data } = await sb.from('favourites').select('*').eq('user_id', user.id);
    favs = data || [];
  } catch(e) { favs = []; }
}

async function toggleFav(v) {
  if (!v) return;
  if (!user) { toast('Sign in to save favourites'); return; }
  const ex = favs.find(f => f.place_id === v.id);
  if (ex) {
    await sb.from('favourites').delete().eq('id', ex.id);
    favs = favs.filter(f => f.place_id !== v.id);
    toast('Removed');
  } else {
    const { data } = await sb.from('favourites').insert({
      user_id: user.id, place_id: v.id, name: v.name,
      area: v.hood, rating: v.rating ? v.rating.toString() : null, maps_url: v.maps
    }).select().single();
    if (data) favs.push(data);
    toast('Saved');
  }
  document.querySelectorAll('.fav-btn').forEach(b => {
    const s = !!favs.find(f => f.place_id === b.dataset.id);
    b.classList.toggle('saved', s);
    b.innerHTML = s ? '&#9829;' : '&#9825;';
  });
}

function openFavs() { renderFavsList(); document.getElementById('favsPanel').classList.add('active'); }
function closeFavs() { document.getElementById('favsPanel').classList.remove('active'); }

function renderFavsList() {
  const el = document.getElementById('favsList');
  if (!user) { el.innerHTML = '<div class="fempty">Sign in to save your favourite spots.</div>'; return; }
  if (!favs.length) { el.innerHTML = '<div class="fempty">Nothing saved yet. Heart a venue to add it here.</div>'; return; }
  el.innerHTML = favs.map((f, i) =>
    '<div class="fitem">' +
      '<div class="fnum">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div style="flex:1"><span class="fname">' + f.name + '</span><span class="farea">' + f.area + (f.rating ? ' · ★ ' + f.rating : '') + '</span></div>' +
      '<button class="frm" onclick="rmFav('' + f.place_id + '')">Remove</button>' +
    '</div>'
  ).join('');
}

async function rmFav(pid) {
  const f = favs.find(f => f.place_id === pid);
  if (!f) return;
  await sb.from('favourites').delete().eq('id', f.id);
  favs = favs.filter(x => x.place_id !== pid);
  renderFavsList();
  document.querySelectorAll('.fav-btn').forEach(b => {
    if (b.dataset.id === pid) { b.classList.remove('saved'); b.innerHTML = '&#9825;'; }
  });
  toast('Removed');
}

function updDots(idx) {
  Qs.forEach((_, i) => {

    if (d) d.className = 'pdot' + (i < idx ? ' done' : i === idx ? ' active' : '');
  });
}

function pick(qid, idx, btn) {
  document.querySelectorAll('.opt').forEach(b => b.classList.remove('sel'));

  setTimeout(() => {
    cQ++;
    if (cQ < Qs.length) { updDots(cQ); showQ(cQ); }
    else applyQuiz();
  }, 380);
}

function applyQuiz() {
  if (ans.area !== undefined) {
    areaF = areaQMap[ans.area] || 'Central London';
    document.querySelectorAll('[onclick^="setArea"]').forEach(b => b.classList.remove('on'));

  if (ans.cuisine !== undefined) {
    activeQ = cuisineQMap[ans.cuisine] || '';
    document.getElementById('heroQ').value = activeQ;
    document.getElementById('navQ').value = activeQ;
  }
  showHome();
  if (activeQ) fetchLive(activeQ);

  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── START ──
init();
</script>
</body>
