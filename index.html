<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitemap — London</title>
<meta name="description" content="A curated guide to London's best restaurants, markets and food spots.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Warm, rich palette */
  --bg:       #F7F3EE;   /* warm parchment */
  --bg2:      #EDE8E0;   /* slightly deeper parchment */
  --bg3:      #E2DAD0;   /* card hover / section bg */
  --surface:  #FFFFFF;   /* pure white cards */
  --ink:      #1C1916;   /* near-black warm */
  --ink2:     #4A4540;   /* medium warm grey */
  --ink3:     #9C9590;   /* light warm grey */
  --rule:     #DDD8D0;   /* divider lines */
  --rule2:    #CBC5BC;   /* stronger rules */
  --accent:   #C4572A;   /* terracotta — main accent */
  --accent2:  #E07848;   /* lighter terracotta */
  --accent-bg:#F5EAE4;   /* very pale terracotta bg */
  --gold:     #8B6914;   /* dark gold for ratings */
  --green:    #3A6B3A;   /* dietary green */
  --blue:     #2255AA;   /* halal blue */
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Instrument Sans', system-ui, sans-serif;
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ── AUTH ── */
#authScreen {
  align-items: center; justify-content: center;
  background: linear-gradient(160deg, #2A1F14 0%, #1C1510 50%, #3A2818 100%);
  position: relative; overflow: hidden;
}
#authScreen::before {
  content: '';
  position: absolute; inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Ccircle cx='30' cy='30' r='1'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  opacity: 0.4;
}
.auth-wrap {
  position: relative; z-index: 1;
  width: 100%; max-width: 380px;
  padding: 3rem 2.5rem;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
}
.auth-brand {
  font-family: var(--serif);
  font-size: 3rem; font-weight: 300;
  letter-spacing: 0.1em; text-align: center;
  margin-bottom: 0.25rem; color: #F7F3EE;
}
.auth-city {
  text-align: center; font-size: 0.62rem;
  letter-spacing: 0.35em; text-transform: uppercase;
  color: rgba(247,243,238,0.4); margin-bottom: 2.5rem;
}
.google-btn {
  width: 100%; display: flex; align-items: center;
  justify-content: center; gap: 0.7rem;
  background: rgba(255,255,255,0.92); color: #1C1916;
  border: none; padding: 0.8rem 1rem;
  font-family: var(--sans); font-size: 0.82rem; font-weight: 500;
  cursor: pointer; transition: background 0.15s; margin-bottom: 1.5rem;
}
.google-btn:hover { background: #fff; }
.auth-or {
  display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;
}
.auth-or::before, .auth-or::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.1); }
.auth-or span { font-size: 0.68rem; color: rgba(247,243,238,0.35); letter-spacing: 0.1em; }
.auth-tabs {
  display: flex; border-bottom: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 1.5rem;
}
.auth-tab {
  flex:1; padding: 0.55rem 0; text-align: center;
  font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(247,243,238,0.35); border: none; background: transparent;
  cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px; font-family: var(--sans); transition: all 0.15s;
}
.auth-tab.active { color: #F7F3EE; border-bottom-color: var(--accent2); }
.auth-field { margin-bottom: 1rem; }
.auth-field label {
  display: block; font-size: 0.62rem; letter-spacing: 0.15em;
  text-transform: uppercase; color: rgba(247,243,238,0.4); margin-bottom: 0.5rem;
}
.auth-field input {
  width: 100%; background: transparent;
  border: none; border-bottom: 1px solid rgba(255,255,255,0.15);
  color: #F7F3EE; padding: 0.5rem 0;
  font-family: var(--sans); font-size: 0.88rem;
  outline: none; transition: border-color 0.15s;
}
.auth-field input:focus { border-bottom-color: var(--accent2); }
.auth-field input::placeholder { color: rgba(247,243,238,0.25); }
.auth-submit {
  width: 100%; background: var(--accent); color: #F7F3EE;
  border: none; padding: 0.85rem;
  font-family: var(--sans); font-size: 0.72rem;
  letter-spacing: 0.15em; text-transform: uppercase;
  cursor: pointer; margin-top: 0.5rem; transition: background 0.15s;
}
.auth-submit:hover { background: var(--accent2); }
.auth-skip {
  width: 100%; background: transparent;
  border: none; color: rgba(247,243,238,0.35);
  font-family: var(--sans); font-size: 0.72rem;
  cursor: pointer; margin-top: 1.2rem;
  text-decoration: underline; text-underline-offset: 3px;
  letter-spacing: 0.04em;
}
.auth-skip:hover { color: rgba(247,243,238,0.7); }
.auth-err { font-size: 0.75rem; color: #E07878; margin-top: 0.8rem; text-align: center; min-height: 1rem; }

/* ── NAV ── */
.app-nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(247,243,238,0.97);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--rule);
}
.nav-top {
  display: flex; align-items: center;
  padding: 0 2.5rem; height: 58px; gap: 2rem;
}
.nav-brand {
  font-family: var(--serif); font-size: 1.7rem; font-weight: 300;
  letter-spacing: 0.08em; color: var(--ink);
  cursor: pointer; flex-shrink: 0; text-decoration: none;
}
.nav-brand span { color: var(--accent); }
.nav-search-wrap { flex: 1; max-width: 480px; position: relative; }
.nav-search-wrap input {
  width: 100%; background: var(--bg2);
  border: 1px solid var(--rule); border-radius: 6px;
  padding: 0.5rem 3.5rem 0.5rem 1rem;
  font-family: var(--sans); font-size: 0.82rem;
  color: var(--ink); outline: none; transition: all 0.15s;
}
.nav-search-wrap input:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.nav-search-wrap input::placeholder { color: var(--ink3); }
.nav-search-btn {
  position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
  background: var(--accent); border: none; color: #fff;
  padding: 0.3rem 0.7rem; border-radius: 4px;
  font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
  font-family: var(--sans); cursor: pointer; transition: background 0.15s;
}
.nav-search-btn:hover { background: var(--accent2); }
.nav-right { display: flex; align-items: center; gap: 1.2rem; margin-left: auto; flex-shrink: 0; }
.nav-link {
  font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink3); cursor: pointer; background: none; border: none;
  font-family: var(--sans); transition: color 0.15s; white-space: nowrap;
}
.nav-link:hover { color: var(--accent); }
.nav-link.cta {
  background: var(--accent); color: #fff;
  padding: 0.45rem 1rem; border-radius: 4px; font-size: 0.65rem;
}
.nav-link.cta:hover { background: var(--accent2); color: #fff; }
.nav-user { font-size: 0.7rem; color: var(--ink3); }

/* Filter strip */
.filter-strip {
  display: flex; align-items: center;
  padding: 0 2.5rem; gap: 0;
  border-top: 1px solid var(--rule);
  overflow-x: auto; scrollbar-width: none;
  background: var(--bg2);
}
.filter-strip::-webkit-scrollbar { display: none; }
.fchip {
  font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink3); background: none; border: none;
  padding: 0.65rem 1rem; cursor: pointer;
  font-family: var(--sans);
  border-bottom: 2px solid transparent;
  white-space: nowrap; transition: all 0.15s;
  flex-shrink: 0;
}
.fchip:hover { color: var(--ink); }
.fchip.active { color: var(--accent); border-bottom-color: var(--accent); }
.fsep { width: 1px; height: 12px; background: var(--rule2); flex-shrink: 0; margin: 0 0.3rem; }
.fsel {
  font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink3); background: none; border: none;
  font-family: var(--sans); cursor: pointer; outline: none;
  padding: 0.65rem 0.4rem; appearance: none; flex-shrink: 0;
}
.fsel:focus { color: var(--ink); }

/* ── HOME ── */
#homeScreen { background: var(--bg); }

/* Hero — rich dark */
.hero {
  background: linear-gradient(145deg, #2A1F14 0%, #1C1510 60%, #3A2818 100%);
  padding: 5rem 2.5rem 4rem;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4rem; align-items: end;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Crect x='0' y='0' width='1' height='1'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.hero-left { position: relative; z-index: 1; }
.hero-kicker {
  font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--accent2); margin-bottom: 1.5rem; opacity: 0.8;
}
.hero-title {
  font-family: var(--serif); font-size: clamp(3rem, 6vw, 5.5rem);
  font-weight: 300; line-height: 1; letter-spacing: -0.01em;
  color: #F7F3EE; margin-bottom: 2.5rem;
}
.hero-title em { font-style: italic; color: var(--accent2); }
.hero-search {
  display: flex; align-items: center;
  background: rgba(247,243,238,0.08);
  border: 1px solid rgba(247,243,238,0.15);
  border-radius: 8px; overflow: hidden;
  transition: all 0.2s; max-width: 500px;
}
.hero-search:focus-within {
  background: rgba(247,243,238,0.12);
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(196,87,42,0.2);
}
.hero-search input {
  flex: 1; background: none; border: none;
  color: #F7F3EE; padding: 1rem 1.2rem;
  font-family: var(--sans); font-size: 0.9rem; outline: none;
}
.hero-search input::placeholder { color: rgba(247,243,238,0.35); }
.hero-search-go {
  background: var(--accent); border: none; color: #fff;
  padding: 0.85rem 1.4rem; font-family: var(--sans);
  font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; transition: background 0.15s; flex-shrink: 0;
}
.hero-search-go:hover { background: var(--accent2); }
.hero-right { position: relative; z-index: 1; }
.hero-tags-label {
  font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(247,243,238,0.3); margin-bottom: 1.2rem;
}
.hero-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 3rem; }
.htag {
  font-family: var(--serif); font-style: italic;
  font-size: 1.05rem; font-weight: 300;
  color: rgba(247,243,238,0.55); background: none; border: none;
  cursor: pointer; padding: 0; transition: color 0.15s;
}
.htag:hover { color: var(--accent2); }
.htag::after { content: ' ·'; color: rgba(247,243,238,0.2); }
.htag:last-child::after { display: none; }
.hero-stats { display: flex; gap: 2.5rem; }
.stat-n {
  font-family: var(--serif); font-size: 2.2rem;
  font-weight: 300; color: #F7F3EE; display: block; line-height: 1;
}
.stat-l {
  font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(247,243,238,0.3); display: block; margin-top: 0.3rem;
}

/* AI strip */
.ai-strip {
  display: none; padding: 0.9rem 2.5rem;
  background: var(--accent-bg);
  border-bottom: 1px solid #DDD0C8;
  align-items: baseline; gap: 1rem;
}
.ai-strip.show { display: flex; }
.ai-strip-lbl {
  font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent); flex-shrink: 0;
}
.ai-strip-txt {
  font-family: var(--serif); font-style: italic;
  font-size: 0.95rem; font-weight: 300;
  color: var(--ink2); line-height: 1.4;
}

/* Section header */
.sec-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 2rem 2.5rem 1.2rem;
}
.sec-title {
  font-family: var(--serif); font-size: 1.5rem; font-weight: 300;
  letter-spacing: 0.02em; color: var(--ink);
}
.sec-count { font-size: 0.68rem; color: var(--ink3); letter-spacing: 0.06em; }

/* Venue list */
.venue-list { padding: 0 0 4rem; }

.venue-row {
  display: grid; grid-template-columns: 52px 1fr auto;
  align-items: start; gap: 1.5rem;
  padding: 1.4rem 2.5rem;
  border-bottom: 1px solid var(--rule);
  cursor: pointer; transition: background 0.12s;
  animation: fadeIn 0.4s ease both;
}
.venue-row:hover { background: var(--bg2); }
.venue-row:nth-child(odd) { background: var(--surface); }
.venue-row:nth-child(odd):hover { background: var(--bg2); }

.v-num {
  font-family: var(--serif); font-size: 0.7rem;
  color: var(--ink3); padding-top: 0.2rem;
  font-weight: 300;
}
.v-main {}
.v-name-row {
  display: flex; align-items: baseline;
  gap: 0.7rem; margin-bottom: 0.3rem; flex-wrap: wrap;
}
.v-name {
  font-family: var(--serif); font-size: 1.25rem;
  font-weight: 400; letter-spacing: 0.01em; line-height: 1.2;
}
.v-ctag {
  font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-bg);
  padding: 0.15rem 0.5rem; border-radius: 2px;
}
.v-live {
  font-size: 0.6rem; color: var(--ink3); display: flex;
  align-items: center; gap: 0.3rem;
}
.live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #C44; display: inline-block;
}
.v-diet { display: flex; gap: 0.35rem; }
.dpill {
  font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 0.12rem 0.45rem; border-radius: 2px;
}
.d-veg  { background: #EBF5EB; color: var(--green); }
.d-vgn  { background: #E8F4E8; color: #2A5C2A; }
.d-hal  { background: #EBF0F8; color: var(--blue); }
.d-gf   { background: #F3EBF5; color: #6A3A7A; }

.v-meta {
  font-size: 0.72rem; color: var(--ink3);
  display: flex; align-items: center; gap: 0.7rem;
  flex-wrap: wrap; margin-bottom: 0.4rem;
}
.v-meta-sep { color: var(--rule2); }
.v-desc {
  font-family: var(--serif); font-style: italic;
  font-size: 0.88rem; font-weight: 300;
  color: var(--ink2); line-height: 1.55;
  max-width: 580px; margin-bottom: 0.5rem;
}
.v-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; }
.vtag {
  font-size: 0.58rem; letter-spacing: 0.06em;
  color: var(--ink3); background: var(--bg3);
  padding: 0.15rem 0.5rem; border-radius: 2px;
}

.v-right {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 0.6rem;
  padding-top: 0.2rem; flex-shrink: 0;
}
.v-rating {
  font-family: var(--serif); font-size: 1rem;
  font-weight: 400; color: var(--gold);
  display: flex; align-items: center; gap: 0.2rem;
}
.v-price { font-size: 0.7rem; color: var(--ink3); }
.v-actions { display: flex; align-items: center; gap: 0.7rem; }
.fav-btn {
  background: none; border: none;
  font-size: 0.9rem; cursor: pointer;
  color: var(--ink3); transition: color 0.15s;
}
.fav-btn:hover { color: var(--accent); }
.fav-btn.saved { color: var(--accent); }
.view-link {
  font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent); text-decoration: none;
  border-bottom: 1px solid var(--accent);
  padding-bottom: 1px; transition: opacity 0.15s;
}
.view-link:hover { opacity: 0.6; }

/* Empty */
.empty-state { padding: 5rem 2.5rem; text-align: center; }
.empty-title {
  font-family: var(--serif); font-size: 1.8rem; font-weight: 300;
  font-style: italic; color: var(--ink3); margin-bottom: 0.8rem;
}
.empty-sub { font-size: 0.78rem; color: var(--ink3); margin-bottom: 1.5rem; }
.empty-cta {
  font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--accent); color: #fff; border: none;
  padding: 0.7rem 1.5rem; cursor: pointer; font-family: var(--sans);
  border-radius: 4px;
}

/* ── QUIZ ── */
#quizScreen { background: var(--bg); }
.quiz-sub {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.2rem 2.5rem; border-bottom: 1px solid var(--rule);
  background: var(--bg2);
}
.quiz-sub-lbl { font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink3); }
.pdots { display: flex; gap: 4px; }
.pdot { width: 22px; height: 2px; background: var(--rule2); transition: background 0.3s; }
.pdot.done { background: var(--accent); opacity: 0.4; }
.pdot.active { background: var(--accent); }
.q-stage {
  flex: 1; display: flex; align-items: center;
  justify-content: center; padding: 4rem 2.5rem;
}
.q-card { width: 100%; max-width: 560px; animation: fadeIn 0.4s ease both; }
.q-num { font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--ink3); margin-bottom: 1.2rem; }
.q-text {
  font-family: var(--serif);
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 300; line-height: 1.15;
  margin-bottom: 2.5rem; letter-spacing: -0.01em;
}
.q-text em { font-style: italic; color: var(--accent); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.opts .opt:last-child:nth-child(odd) { grid-column: 1/-1; max-width: 50%; }
.opt {
  background: var(--surface); border: 1px solid var(--rule);
  padding: 1rem 1.2rem; cursor: pointer;
  text-align: left; transition: all 0.15s;
  font-family: var(--sans); border-radius: 6px;
}
.opt:hover { border-color: var(--accent); background: var(--accent-bg); }
.opt.sel { border-color: var(--accent); background: var(--accent); color: #fff; }
.opt-e { font-size: 1.2rem; display: block; margin-bottom: 0.4rem; }
.opt-l { font-family: var(--serif); font-size: 1rem; font-weight: 400; display: block; }
.opt-s { font-size: 0.7rem; color: var(--ink3); display: block; margin-top: 0.15rem; }
.opt.sel .opt-s { color: rgba(255,255,255,0.65); }
.skip-row { text-align: center; margin-top: 2rem; }
.skip-btn {
  font-size: 0.7rem; letter-spacing: 0.06em; color: var(--ink3);
  background: none; border: none; cursor: pointer;
  font-family: var(--sans); text-decoration: underline; text-underline-offset: 3px;
}
.skip-btn:hover { color: var(--ink); }

/* ── MODALS ── */
#addModal {
  position: fixed; inset: 0;
  background: rgba(28,25,22,0.7);
  z-index: 400; display: none;
  align-items: center; justify-content: center; padding: 1.5rem;
}
#addModal.active { display: flex; }
.modal-box {
  background: var(--surface); width: 100%; max-width: 480px;
  max-height: 88vh; overflow-y: auto;
  padding: 2.5rem; animation: fadeIn 0.25s ease both;
  border-radius: 8px; border-top: 4px solid var(--accent);
  box-shadow: 0 24px 60px rgba(0,0,0,0.25);
}
.modal-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2rem; }
.modal-title { font-family: var(--serif); font-size: 1.8rem; font-weight: 300; }
.modal-close {
  background: none; border: none; cursor: pointer;
  font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink3); font-family: var(--sans);
}
.mfield { margin-bottom: 1.2rem; }
.mfield label {
  display: block; font-size: 0.62rem; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--ink3); margin-bottom: 0.5rem;
}
.mfield input, .mfield select, .mfield textarea {
  width: 100%; background: var(--bg);
  border: none; border-bottom: 1px solid var(--rule2);
  color: var(--ink); padding: 0.5rem 0;

// ── SEARCH ──
function qs(q){document.getElementById('heroQ').value=q;document.getElementById('navQ').value=q;doSearch();}
function doSearch(){
  const raw=(document.getElementById('heroQ').value||document.getElementById('navQ').value).trim();
  document.getElementById('heroQ').value=raw;
  document.getElementById('navQ').value=raw;
  if(!raw){activeQ='';hideAI();applyFilters();return;}
  activeQ=raw.toLowerCase();
  applyFilters();
  fetchLive(raw);
}

async function fetchLive(raw){
  const area=areaF!=='all'?areaF:'London';
  showAI(`Searching for "${raw}" across ${area}…`,true);
  try{
    const url=`https://maps.googleapis.com/maps/api/place/textsearch/json?query=${encodeURIComponent(raw+' restaurant '+area)}&key=${GKEY}`;
    const r=await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
    const d=await r.json();
    if(d.results?.length){
      const live=d.results.slice(0,8).map(p=>({
        id:p.place_id,name:p.name,
        area:area,hood:p.formatted_address?.split(',')[1]?.trim()||area,
        type:'restaurant',cuisine:raw.charAt(0).toUpperCase()+raw.slice(1),
        diet:[],rating:p.rating||null,pl:p.price_level||2,
        cost:['under20','under20','20-40','40-70','70plus'][p.price_level||2],
        desc:`A well-regarded ${area} spot for ${raw}.`,
        tags:[raw,'Live'],maps:`https://www.google.com/maps/place/?q=place_id:${p.place_id}`,
        isLive:true
      }));
      const local=venues.filter(v=>matches(v,activeQ));
      const merged=[...live,...local.filter(l=>!live.find(lv=>lv.name===l.name))];
      document.getElementById('secTitle').textContent=`Results for "${raw}"`;
      document.getElementById('secCount').textContent=`${merged.length} spot${merged.length!==1?'s':''}`;
      renderVenues(merged);
      const rec=await getAIRec(raw,area,merged.slice(0,3).map(v=>v.name).join(', '));
      if(rec)showAI(rec,false);else hideAI();
    }
  }catch(e){hideAI();}
}

async function getAIRec(q,area,names){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:60,
        messages:[{role:'user',content:`You are Bitemap, a London food guide. Search: "${q}" in ${area}. Top spots: ${names}. One warm specific sentence (max 15 words) recommending what to try. No hashtags or em-dashes.`}]})
    });
    const d=await r.json();return d.content?.[0]?.text?.trim()||null;
  }catch(e){return null;}
}

  el.style.color=loading?'var(--ink3)':'var(--ink2)';
  el.textContent=txt;
  strip.classList.add('show');
}
function hideAI(){document.getElementById('aiStrip').classList.remove('show');}

// ── FILTERS ──
function setType(t,btn){typeF=t;document.querySelectorAll('[onclick^="setType"]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');hideAI();applyFilters();}
function setArea(a,btn){areaF=a;document.querySelectorAll('[onclick^="setArea"]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');applyFilters();}
function toggleDiet(d,btn){if(diets.has(d)){diets.delete(d);btn.classList.remove('active');}else{diets.add(d);btn.classList.add('active');}applyFilters();}
function matches(v,q){
  if(!q)return true;
  const fields=[v.name,v.area,v.hood,v.cuisine,v.desc,...(v.tags||[]),...(v.diet||[])];
  if(fields.some(s=>s?.toLowerCase().includes(q)))return true;
  // Broad keyword aliases
  const aliases={
    'ramen':['japanese','noodles','tonkotsu'],
    'burger':['burgers','smash burger','american'],
    'pizza':['neapolitan','italian pizza'],
    'sushi':['japanese','omakase'],
    'tacos':['mexican','tex-mex'],
    'curry':['indian','keralan','sri lankan','bangladeshi'],
    'brunch':['breakfast','cafe','all day'],
    'steak':['steakhouse','british steak','flat iron'],
    'dim sum':['chinese','taiwanese','asian','bao'],
    'pasta':['italian','spaghetti'],
    'cocktails':['bar','speakeasy','cocktail'],
    'vegan':['plant-based','vegan chinese'],
    'halal':['halal'],
    'market':['food market','street market','food hall'],
    'natural wine':['wine bar','natural wine'],
  };
  for(const[alias,related]of Object.entries(aliases)){
    if(q.includes(alias)||alias.includes(q)){
      if(related.some(r=>fields.some(s=>s?.toLowerCase().includes(r))))return true;
    }
  }
  return false;
}
function applyFilters(){
  const minR=parseFloat(document.getElementById('ratingF')?.value||0);
  const cost=document.getElementById('costF')?.value||'all';
  const sort=document.getElementById('sortF')?.value||'rating';
  let res=venues.filter(v=>{
    if(typeF!=='all'&&v.type!==typeF)return false;
    if(areaF!=='all'&&v.area!==areaF)return false;
    if(minR>0&&(v.rating||0)<minR)return false;
    if(cost!=='all'&&v.cost!==cost)return false;
    if(diets.size>0&&![...diets].every(d=>(v.diet||[]).includes(d)))return false;
    if(activeQ&&!matches(v,activeQ))return false;
    return true;
  });
  if(sort==='rating')res.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else res.sort((a,b)=>a.name.localeCompare(b.name));
  const title=activeQ?`Results for "${activeQ}"`:typeF==='market'?'Markets':typeF==='cafe'?'Cafés':typeF==='bar'?'Bars':typeF==='restaurant'?'Restaurants':'Featured';
  document.getElementById('secTitle').textContent=title;
  document.getElementById('secCount').textContent=`${res.length} spot${res.length!==1?'s':''}`;
  renderVenues(res);
}

// ── RENDER ──
function renderVenues(list){
  window.VM={};
  list.forEach(v=>window.VM[v.id]=v);
  const el=document.getElementById('venueList');
  if(!list.length){
    el.innerHTML=`<div class="empty-state"><div class="empty-title">Nothing found</div><div class="empty-sub">Try a different search, or add a venue we're missing.</div><button class="empty-cta" onclick="openAdd()">Add a venue</button></div>`;
    return;
  }
  el.innerHTML=list.map((v,i)=>{
    const saved=!!favs.find(f=>f.place_id===v.id);
    const dietBadges=(v.diet||[]).map(d=>{
      const cls={vegan:'diet-vegan',vegetarian:'diet-veg',halal:'diet-halal',glutenfree:'diet-gf'}[d]||'diet-veg';
      const lbl={vegan:'Vegan',vegetarian:'Vegetarian',halal:'Halal',glutenfree:'GF'}[d]||d;
      return `<span class="diet-pill ${cls}">${lbl}</span>`;
    }).join('');
    return `
    <div class="venue-row" style="animation-delay:${Math.min(i*0.04,0.35)}s" onclick="window.open('${v.maps}','_blank')">
      <div class="v-num">${String(i+1).padStart(2,'0')}</div>
      <div class="v-main">
        <div class="v-name-row">
          <span class="v-name">${v.name}</span>
          <span class="v-ctag">${v.cuisine}</span>
          ${v.isLive?'<span style="font-size:0.62rem;color:#9A9893"><span class="live-dot"></span>Live</span>':''}
          <div class="v-diet">${dietBadges}</div>
        </div>
        <div class="v-meta">
          <span>📍 ${v.hood}</span>
          ${v.rating?`<span class="v-meta-sep">·</span><span>★ ${v.rating}</span>`:''}
          <span class="v-meta-sep">·</span>
          <span>${v.type}</span>
          ${v.cost?`<span class="v-meta-sep">·</span><span>${costMap[v.cost]||''}</span>`:''}
        </div>
        <div class="v-desc">${v.desc}</div>
        <div class="v-tags">${(v.tags||[]).map(t=>`<span class="vtag">${t}</span>`).join('')}</div>
      </div>
      <div class="v-right" onclick="event.stopPropagation()">
        ${v.rating?`<div class="v-rating">★ ${v.rating}</div>`:''}
        <div class="v-price">${priceMap[v.pl]||'££'}</div>
        <div class="v-actions">
          <button class="fav-btn ${saved?'saved':''}" data-id="${v.id}" onclick="toggleFav(window.VM['${v.id}'])">${saved?'♥':'♡'}</button>
          <a class="view-link" href="${v.maps}" target="_blank" rel="noopener">Maps</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── FAVS ──
async function loadFavs(){if(!user)return;const{data}=await sb.from('favourites').select('*').eq('user_id',user.id);favs=data||[];}
async function toggleFav(v){
  if(!v)return;
  if(!user){toast('Sign in to save favourites');return;}
  const ex=favs.find(f=>f.place_id===v.id);
  if(ex){
    await sb.from('favourites').delete().eq('id',ex.id);
    favs=favs.filter(f=>f.place_id!==v.id);toast('Removed');
  }else{
    const{data}=await sb.from('favourites').insert({user_id:user.id,place_id:v.id,name:v.name,area:v.hood,rating:v.rating?.toString(),maps_url:v.maps}).select().single();
    if(data)favs.push(data);toast('Saved');
  }
  document.querySelectorAll('.fav-btn').forEach(b=>{const s=!!favs.find(f=>f.place_id===b.dataset.id);b.classList.toggle('saved',s);b.textContent=s?'♥':'♡';});
}
function openFavs(){renderFavsList();document.getElementById('favsPanel').classList.add('active');}
function closeFavs(){document.getElementById('favsPanel').classList.remove('active');}
function closeFavsOut(e){if(e.target===document.getElementById('favsPanel'))closeFavs();}
function renderFavsList(){
  const el=document.getElementById('favsList');
  if(!user){el.innerHTML='<div class="favs-empty">Sign in to save your favourite spots.</div>';return;}
  if(!favs.length){el.innerHTML='<div class="favs-empty">Nothing saved yet. Heart a venue to add it here.</div>';return;}
  el.innerHTML=favs.map((f,i)=>`
    <div class="fav-item">
      <div class="fav-n">${String(i+1).padStart(2,'0')}</div>
      <div class="fav-info"><span class="fav-name">${f.name}</span><span class="fav-area">${f.area}${f.rating?' · ★ '+f.rating:''}</span></div>
      <button class="fav-rm" onclick="rmFav('${f.place_id}')">Remove</button>
    </div>`).join('');
}
async function rmFav(pid){
  const f=favs.find(f=>f.place_id===pid);if(!f)return;
  await sb.from('favourites').delete().eq('id',f.id);
  favs=favs.filter(x=>x.place_id!==pid);renderFavsList();
  document.querySelectorAll('.fav-btn').forEach(b=>{if(b.dataset.id===pid){b.classList.remove('saved');b.textContent='♡';}});
  toast('Removed');
}

function openAdd(){document.getElementById('addModal').classList.add('active');}
function closeAdd(){document.getElementById('addModal').classList.remove('active');}
function closeAddOut(e){if(e.target===document.getElementById('addModal'))closeAdd();}
async function submitVenue(){
  const name=document.getElementById('vName').value.trim();
  const area=document.getElementById('vArea').value.trim();
  if(!name||!area){toast('Please fill in name and area');return;}
  try{await sb.from('venue_submissions').insert({name,area,type:document.getElementById('vType').value,cuisine:document.getElementById('vCuisine').value,cost:document.getElementById('vCost').value,desc:document.getElementById('vDesc').value,maps_url:document.getElementById('vMaps').value,status:'pending',submitted_at:new Date().toISOString()});}catch(e){}
  closeAdd();toast('Submitted — thank you');
  ['vName','vArea','vCuisine','vDesc','vMaps'].forEach(id=>{document.getElementById(id).value='';});
}

// ── QUIZ ──
const Qs=[
  {id:'occasion',text:'What\'s <em>tonight</em> about?',opts:[{e:'💑',l:'Date night',s:'Romantic, impressive'},{e:'👯',l:'With friends',s:'Fun, groups, loud'},{e:'🧘',l:'Solo dinner',s:'Just me'},{e:'💼',l:'Work dinner',s:'Relaxed but smart'},{e:'🎂',l:'Celebration',s:'Pull out all stops'}]},
  {id:'cuisine',text:'What are you <em>craving</em>?',opts:[{e:'🍜',l:'Asian',s:'Japanese, Thai, Chinese'},{e:'🍕',l:'European',s:'Italian, French, Spanish'},{e:'🍛',l:'South Asian',s:'Indian, Sri Lankan'},{e:'🌮',l:'Americas',s:'Mexican, American'},{e:'🌍',l:'Middle Eastern',s:'Lebanese, Turkish'}]},
  {id:'area',text:'Which part of <em>London</em>?',opts:[{e:'🗺️',l:'East',s:'Shoreditch, Hackney'},{e:'🏛️',l:'Central',s:'Soho, Covent Garden'},{e:'🌳',l:'North',s:'Islington, Camden'},{e:'🌉',l:'South',s:'Brixton, Peckham'}]},
  {id:'budget',text:'What\'s the <em>budget</em>?',opts:[{e:'',l:'Under £20 a head',s:'Street food vibes'},{e:'',l:'£20–40 a head',s:'Solid night out'},{e:'',l:'£40–70 a head',s:'Proper dinner'},{e:'',l:'No limit',s:'Tonight is special'}]},
  {id:'vibe',text:'The <em>atmosphere</em>?',opts:[{e:'',l:'Intimate & quiet',s:'Good conversation'},{e:'',l:'Buzzy & fun',s:'Energy and noise'},{e:'',l:'Sleek & minimal',s:'Design-forward'},{e:'',l:'Neighbourhood gem',s:'Local, unpretentious'}]}
];
const areaQMap={0:'East London',1:'Central London',2:'North London',3:'South London'};
const cuisineQMap={0:'asian',1:'italian',2:'indian',3:'mexican',4:'middle eastern'};

function buildDots(){document.getElementById('pdots').innerHTML=Qs.map((_,i)=>`<div class="pdot${i===0?' active':''}" id="pd${i}"></div>`).join('');}
function updDots(idx){Qs.forEach((_,i)=>{const d=document.getElementById(`pd${i}`);if(d)d.className='pdot'+(i<idx?' done':i===idx?' active':'');});}
function showQ(idx){
  const q=Qs[idx];
  document.getElementById('qStage').innerHTML=`
    <div class="q-card">
      <div class="q-num">${idx+1} / ${Qs.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="opts">
        ${q.opts.map((o,i)=>`<button class="opt" onclick="pick('${q.id}',${i},this)"><span class="opt-e">${o.e}</span><span class="opt-l">${o.l}</span><span class="opt-s">${o.s}</span></button>`).join('')}
      </div>
      <div class="skip-row"><button class="skip-btn" onclick="showHome()">Skip — take me straight to search</button></div>
    </div>`;
}
function pick(qid,idx,btn){
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');ans[qid]=idx;
  setTimeout(()=>{cQ++;if(cQ<Qs.length){updDots(cQ);showQ(cQ);}else applyQuiz();},380);
}
function applyQuiz(){
  if(ans.area!==undefined){areaF=areaQMap[ans.area]||'Central London';document.querySelectorAll('[onclick^="setArea"]').forEach(b=>b.classList.remove('active'));}
  if(ans.cuisine!==undefined){
    activeQ=cuisineQMap[ans.cuisine]||'';
    document.getElementById('heroQ').value=activeQ;
    document.getElementById('navQ').value=activeQ;
  }
  showHome();
  if(activeQ)fetchLive(activeQ);else applyFilters();
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

init();

</script>
